name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-deno
      - run: deno task check
      - run: deno task lint
      # Paused: unit tests run locally several times per session.
      # - run: deno task test:unit
