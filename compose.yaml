name: trakt-client

services:
  app:
    build: .
    image: trakt-client
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - image-cache:/var/cache/trakt/images
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  image-cache:
